<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>星詠み研究所</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       A1：情報入力画面
  ========================== -->
  <section id="page1" class="page active">

    <div class="container">

      <div class="logo">
        ✦ 星詠み研究所 ✦
      </div>

      <h1>あなたの星詠み診断</h1>

      <p class="lead">
        あなたの情報を入力してください
      </p>

      <div class="form-box">

        <label for="name">
          お名前
        </label>

        <input
          type="text"
          id="name"
          placeholder="例：星野 花子"
        >

        <label for="birthday">
          生年月日
        </label>

        <input
          type="date"
          id="birthday"
        >

        <button
          class="main-button"
          onclick="startDiagnosis()"
        >
          星を詠む
        </button>

      </div>

    </div>

  </section>


  <!-- =========================
       A2：診断結果表示画面
  ========================== -->
  <section id="page2" class="page">

    <div class="container">

      <div class="logo">
        ✦ 星詠み研究所 ✦
      </div>

      <h1>診断結果</h1>

      <div class="result-card">

        <p class="result-name">
          <span id="resultName"></span>さんの星
        </p>

        <div class="star-symbol">
          ✦
        </div>

        <h2 id="resultType">
          星の探究者
        </h2>

        <p id="resultText" class="result-text">
          あなたは、物事を深く考え、
          自分の答えを見つけていく力を持っています。
        </p>

        <div class="result-section">
          <h3>あなたの特徴</h3>

          <p id="featureText">
            感受性が豊かで、
            周囲の変化を敏感に感じ取るタイプです。
          </p>
        </div>

        <div class="result-section">
          <h3>星からのメッセージ</h3>

          <p id="messageText">
            焦らず、自分の歩幅で進んでください。
            あなたが選んだ道には意味があります。
          </p>
        </div>

      </div>

      <button
        class="main-button"
        onclick="showSavePage()"
      >
        結果を画像で保存する
      </button>

      <button
        class="sub-button"
        onclick="showPage(1)"
      >
        もう一度診断する
      </button>

    </div>

  </section>


  <!-- =========================
       A3：画像保存画面
  ========================== -->
  <section id="page3" class="page">

    <div class="container">

      <div class="logo">
        ✦ 星詠み研究所 ✦
      </div>

      <h1>保存用画像</h1>

      <p class="save-description">
        下の画像を長押しして<br>
        「写真に保存」を選択してください。
      </p>

      <!--
        この画像がCanvasから生成されます。
        ダウンロードボタンは使用しません。
      -->
      <div class="image-wrapper">
        <img
          id="saveImage"
          alt="星詠み研究所の診断結果"
        >
      </div>

      <p class="save-help">
        📱 iPhoneの場合<br>
        画像を長押し →「写真に保存」
      </p>

      <button
        class="sub-button"
        onclick="showPage(2)"
      >
        診断結果に戻る
      </button>

    </div>

  </section>


  <!-- Canvasは画像生成用 -->
  <canvas id="resultCanvas"></canvas>


  <script src="script.js"></script>

</body>
</html>
