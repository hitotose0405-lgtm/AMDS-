<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>診断サイト</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       サイト全体
  ========================== -->

  <main class="app">

    <!-- =========================
         一覧画面
    ========================== -->

    <section id="screen-list" class="screen active">

      <div class="header">
        <p class="sub-title">YOUR DIAGNOSIS</p>
        <h1>一覧</h1>
        <p class="description">
          診断したい項目を選択してください
        </p>
      </div>

      <div class="category-list">

        <button class="category-card" onclick="startCategory('A')">
          <span class="category-letter">A</span>
          <span class="category-name">Aの診断</span>
          <span class="arrow">›</span>
        </button>

        <button class="category-card" onclick="startCategory('B')">
          <span class="category-letter">B</span>
          <span class="category-name">Bの診断</span>
          <span class="arrow">›</span>
        </button>

        <button class="category-card" onclick="startCategory('C')">
          <span class="category-letter">C</span>
          <span class="category-name">Cの診断</span>
          <span class="arrow">›</span>
        </button>

        <button class="category-card" onclick="startCategory('D')">
          <span class="category-letter">D</span>
          <span class="category-name">Dの診断</span>
          <span class="arrow">›</span>
        </button>

      </div>

    </section>


    <!-- =========================
         A1〜D1 入力画面
    ========================== -->

    <section id="screen-input" class="screen">

      <div class="header">

        <button class="back-button" onclick="showScreen('screen-list')">
          ← 一覧に戻る
        </button>

        <p class="step">STEP 1 / 3</p>

        <h1>
          <span id="input-category">A</span>1
        </h1>

        <h2 id="input-title">
          情報入力
        </h2>

        <p class="description">
          必要な情報を入力してください
        </p>

      </div>


      <div class="form-card">

        <label for="user-name">
          お名前
        </label>

        <input
          type="text"
          id="user-name"
          placeholder="お名前を入力してください"
        >


        <label for="user-date">
          生年月日
        </label>

        <input
          type="date"
          id="user-date"
        >


        <label for="user-option">
          その他の情報
        </label>

        <textarea
          id="user-option"
          placeholder="自由に入力してください"
        ></textarea>


        <button
          class="primary-button"
          onclick="showResult()"
        >
          結果を見る
        </button>

      </div>

    </section>


    <!-- =========================
         A2〜D2 結果画面
    ========================== -->

    <section id="screen-result" class="screen">

      <div class="header">

        <p class="step">STEP 2 / 3</p>

        <h1>
          <span id="result-category">A</span>2
        </h1>

        <h2>
          診断結果
        </h2>

      </div>


      <!--
        この部分がA3で画像化されます
      -->

      <div id="result-card" class="result-card">

        <div class="result-category">
          <span id="result-letter">A</span>
        </div>

        <p class="result-label">
          DIAGNOSIS RESULT
        </p>

        <h2 id="result-name">
          あなたの診断結果
        </h2>

        <div class="result-score">

          <span id="result-score">
            85
          </span>

          <small>POINT</small>

        </div>


        <div class="result-line"></div>


        <h3 id="result-title">
          素晴らしい可能性を持っています
        </h3>

        <p id="result-description">
          あなたには独自の魅力と可能性があります。
          自分自身の感覚を大切にしながら、
          あなたらしい道を進んでいくことで、
          さらに大きな可能性が開いていくでしょう。
        </p>


        <div class="result-info">

          <div>
            <span>NAME</span>
            <strong id="display-name">---</strong>
          </div>

          <div>
            <span>TYPE</span>
            <strong id="display-type">A</strong>
          </div>

        </div>

      </div>


      <div class="button-area">

        <button
          class="primary-button"
          onclick="goToImage()"
        >
          結果画像を作成する
        </button>

        <button
          class="secondary-button"
          onclick="showScreen('screen-input')"
        >
          入力画面に戻る
        </button>

      </div>

    </section>


    <!-- =========================
         A3〜D3 画像保存画面
    ========================== -->

    <section id="screen-image" class="screen">

      <div class="header">

        <p class="step">STEP 3 / 3</p>

        <h1>
          <span id="image-category">A</span>3
        </h1>

        <h2>
          結果画像を保存
        </h2>

        <p class="description">
          診断結果を画像として保存できます
        </p>

      </div>


      <div class="image-preview">

        <img
          id="result-image"
          alt="診断結果画像"
        >

      </div>


      <div class="button-area">

        <button
          class="primary-button"
          onclick="downloadImage()"
        >
          画像を保存する
        </button>


        <button
          class="secondary-button"
          onclick="showScreen('screen-result')"
        >
          A2に戻る
        </button>


        <button
          class="text-button"
          onclick="showScreen('screen-list')"
        >
          一覧に戻る
        </button>

      </div>

    </section>

  </main>


  <!-- html2canvas
       A2の結果画面を画像にするために使用
  -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>

  <script src="script.js"></script>

</body>
</html>
